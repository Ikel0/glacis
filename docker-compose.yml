services:
  redpanda:
    image: redpandadata/redpanda:v24.1.8
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "1G", "--reserve-memory", "0M", "--node-id", "0", "--check=false", "--kafka-addr", "PLAINTEXT://0.0.0.0:9092", "--advertise-kafka-addr", "PLAINTEXT://redpanda:9092"]
  api:
    build: .
    environment:
      GLACIS_DATA_DIR: /var/lib/glacis
    volumes:
      - glacis_data:/var/lib/glacis
    ports:
      - "8090:8090"
  worker:
    build: .
    command: ["python", "-m", "glacis.worker"]
    environment:
      GLACIS_API_URL: http://api:8090
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      - redpanda
      - api
volumes:
  glacis_data:
